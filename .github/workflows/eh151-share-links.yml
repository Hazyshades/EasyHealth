name: EH-151 Share Links

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - run: pnpm install --frozen-lockfile
      - name: Run EH-151 route fixtures
        run: pnpm test:eh151

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase services
        run: supabase db start
      - name: Run EH-151 database contract
        run: pnpm test:eh151-db
      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
