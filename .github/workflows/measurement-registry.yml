name: Measurement Registry

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install worker dependencies
        run: pnpm --dir worker install --frozen-lockfile
      - name: Verify CI suite coverage contract
        run: pnpm check:ci-suite-coverage-contract
      - name: Verify every test suite is workflow-reachable
        run: pnpm check:ci-suite-coverage
      - run: pnpm typecheck
      - name: Verify generated biomarker documentation
        run: pnpm check:biomarker-docs
      - name: Verify biomarker documentation contract
        run: pnpm test:biomarker-docs
      - name: Verify laboratory persistence boundaries
        run: pnpm test:document-persistence-boundaries
      - name: Verify Health Profile laboratory projection
        run: pnpm test:health-profile-lab-input
      - run: pnpm check:registry-v2-cutover
      - run: pnpm check:no-legacy-promotion-rpc
      - run: pnpm check:postgrest-embed-hints
      - run: pnpm verify:registry
        env:
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - name: Verify document worker reliability
        run: pnpm test:document-worker
      - name: Verify EH-104 document lifecycle contracts
        run: pnpm test:eh104
      - name: Verify EH-105 instrumental lineage contracts
        run: pnpm test:eh105
      - name: Verify EH-111 clinical compatibility unit contract
        run: pnpm test:eh111
      - name: Verify EH-113 CBC launch catalog
        run: pnpm test:eh113
      - name: Verify EH-116 registry reprocess batch
        run: pnpm test:eh116
      - run: pnpm test:eh106
        env:
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - run: pnpm test:eh118
        env:
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - name: Verify EH-162 source-region hover contract
        run: pnpm test:eh162
      - name: Validate Registry 2.0 candidate-release evidence
        run: pnpm check:registry-v2-candidate-corpus-technical
      - name: Verify EH-163 Mistral OCR contract
        run: pnpm test:eh163-ocr
      - name: Verify CBC measurement regression suite
        run: pnpm test:cbc-regression
      - name: Verify static Registry 2.0 panel membership
        run: pnpm test:panel-registry
      - name: Verify stated-axis evidence policy
        run: pnpm test:stated-axis
        env:
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      # #114: these four assert user-facing review copy and counters. All were
      # local-only, which is why a sentence that was false for twelve rows on a
      # real document shipped green. See issue #110 for the general case.
      - name: Verify incomplete reason classes
        run: pnpm test:reason-class
        env:
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - name: Verify incomplete-outcome presentation
        run: pnpm test:eh112
        env:
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - name: Verify document review state
        run: pnpm test:document-review
        env:
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - name: Verify observation review workspace
        run: pnpm test:eh117
        env:
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - name: Verify EH-120 lifecycle transitions
        run: pnpm test:eh120
      - name: Verify observation correction flow
        run: pnpm test:eh119
        env:
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - name: Verify observation change history
        run: pnpm test:eh121
      - name: Verify EH-123 assessment recalculation contracts
        run: pnpm test:eh123
      - name: Verify batch verification contracts
        run: pnpm test:eh122
      - name: Verify EH-126 medical-event contracts
        run: pnpm test:eh126
      - name: Verify EH-127 health timeline contracts
        run: pnpm test:eh127
      - name: Verify EH-132 synthetic fixture pack
        run: pnpm test:eh132-fixtures
      - name: Verify EH-132 timeline and panel release validation
        run: pnpm test:eh132

      - name: Publish Registry 2.0 candidate-release evidence
        run: |
          mkdir -p .artifacts
          pnpm report:registry-v2-candidate-corpus > .artifacts/registry-v2-candidate-release.json
          cp registry/candidate-release/v1/approvals.json .artifacts/registry-v2-candidate-release-approvals.json
          cp registry/candidate-release/v1/reset-rollback.md .artifacts/registry-v2-candidate-release-reset-rollback.md

      - name: Upload Registry 2.0 candidate-release evidence
        uses: actions/upload-artifact@v4
        with:
          name: registry-v2-candidate-release-evidence
          path: |
            .artifacts/registry-v2-candidate-release.json
            .artifacts/registry-v2-candidate-release-approvals.json
            .artifacts/registry-v2-candidate-release-reset-rollback.md
      - run: pnpm build
        env:
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase services
        run: supabase db start
      - name: Run EH-104 Phase B database contract
        run: pnpm test:eh104-db
      - name: Run EH-105 instrumental lineage database contract
        run: pnpm test:eh105-db
      - name: Run EH-106 atomic writer database contract
        run: pnpm test:eh106-db
      - name: Run PostgREST revision embed alias contract
        run: pnpm test:postgrest-alias-db
      - name: Run EH-111 clinical compatibility database contract
        run: pnpm test:eh111-db
      - name: Run EH-114 glucose persistence database contract
        run: pnpm test:eh114-db
      - name: Run alias token-set decision-trace contract
        run: pnpm test:alias-order-db
      - name: Run stated-axis observability column contract
        run: pnpm test:stated-axis-db
      - name: Run EH-119 observation correction database contract
        run: pnpm test:eh119-db
      - name: Run EH-120 lifecycle transition database contract
        run: pnpm test:eh120-db
      - name: Run EH-121 observation change history database contract
        run: pnpm test:eh121-db
      - name: Run EH-123 assessment recalculation database contract
        run: pnpm test:eh123-db
      - name: Run EH-122 batch verification database contract
        run: pnpm test:eh122-db
      - name: Run EH-118 source region database contract
        run: pnpm test:eh118-db
      - name: Run EH-162 source region match database contract
        run: pnpm test:eh162-db
      - name: Run EH-163 Mistral OCR database contract
        run: pnpm test:eh163-db
      - name: Run service-role access database contract
        run: pnpm test:service-role-access-db
      - name: Run EH-113 CBC method evidence database contract
        run: pnpm test:eh113-db
      - name: Run EH-116 registry reprocess database contract
        run: pnpm test:eh116-db
      - name: Run EH-126 medical-event database contract
        run: pnpm test:eh126-db
      - name: Run EH-127 health timeline database contract
        run: pnpm test:eh127-db
      - name: Run EH-132 timeline and panel database release contract
        run: pnpm test:eh132-db
      - name: Run PR2 instrumental database contracts
        run: pnpm test:pr2-db
      - name: Run resolver trace v2 database contract
        run: pnpm test:trace-v2-db
      # #117: the only test that runs the writer's real payload against the real
      # RPC. Acceptance was dead for months because nothing crossed this seam.
      - name: Run the writer-to-RPC seam contract
        run: pnpm test:writer-seam
      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup


  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase services
        run: supabase start
      - name: Export local Supabase connection values
        id: supabase
        shell: bash
        run: |
          api_url="$(supabase status -o env | sed -n 's/^API_URL=//p' | tr -d '"')"
          service_role_key="$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY=//p' | tr -d '"')"
          test -n "$api_url"
          test -n "$service_role_key"
          {
            echo "api_url=$api_url"
            echo "service_role_key=$service_role_key"
          } >> "$GITHUB_OUTPUT"
      - name: Run PostgREST consumer embed contract
        run: pnpm test:postgrest-embeds
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup