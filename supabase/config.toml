project_id = "easyhealth"

[auth]
enabled = true
# Keep this host identical to the URL you open in the browser.
# localhost and 127.0.0.1 are different origins for PKCE / magic links.
site_url = "https://easyhealth-production.up.railway.app"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3000",
  "http://127.0.0.1:3000/auth/callback",
  "https://easyhealth-production.up.railway.app",
  "https://easyhealth-production.up.railway.app/auth/callback",
]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true

[storage.vector]
enabled = false
